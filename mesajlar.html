<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Təbriklər — Seymur & Aytac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ballet&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{--gold:#b8955a;--dk:#8a6a35;--ink:#4a3d2c;--soft:#7a6a55}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Cormorant Garamond',serif;color:var(--ink);background:#fffdf9;min-height:100vh;padding:30px 16px 50px}
  .wrap{max-width:520px;margin:0 auto}
  .names{font-family:'Ballet',cursive;color:var(--dk);font-size:54px;text-align:center;line-height:1.4}
  .sub{text-align:center;letter-spacing:.35em;text-transform:uppercase;font-size:14px;color:var(--soft);margin-bottom:22px}
  .card{background:#fff;border:1px solid rgba(184,149,90,.4);border-radius:4px;padding:22px 18px;margin-bottom:18px;box-shadow:0 8px 30px rgba(120,100,70,.08)}
  input{width:100%;padding:13px 16px;border:1px solid rgba(184,149,90,.6);background:#fff;font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;color:var(--ink);outline:none}
  input:focus{border-color:var(--gold)}
  button{margin-top:14px;width:100%;padding:12px;border:1px solid var(--gold);background:var(--gold);color:#fff;font:inherit;font-size:16px;letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
  button.ghost{background:transparent;color:var(--dk)}
  #err{margin-top:10px;text-align:center;font-size:18px;color:#a4545a;min-height:22px}
  .count{text-align:center;font-style:italic;font-size:19px;color:var(--soft);margin-bottom:8px}
  ul{list-style:none}
  li{padding:14px 2px;border-bottom:1px dashed rgba(184,149,90,.45)}
  li:last-child{border-bottom:none}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .who{font-weight:600;font-size:21px;color:var(--dk)}
  .when{font-size:14px;color:var(--soft)}
  li p{margin-top:4px;font-size:20px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
  .empty{text-align:center;font-style:italic;color:var(--soft);font-size:19px}
  .inf{text-align:center;color:var(--gold);font-size:30px;margin:4px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="names">Seymur &amp; Aytac</div>
  <div class="sub">Qonaqların təbrikləri</div>

  <div class="card" id="login">
    <p style="text-align:center;font-size:20px;margin-bottom:12px">Şifrəni daxil edin</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button id="go">Daxil ol</button>
    <div id="err"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div class="count" id="count"></div>
      <div class="inf">∞</div>
      <ul id="msgs"></ul>
    </div>
    <button class="ghost" id="refresh">Yenilə</button>
  </div>
</div>

<script>
  const SUPABASE_URL='https://fknrihzgzgkvtpyipjlc.supabase.co';
  const SUPABASE_KEY='sb_publishable_lOu3l5mgxve967mRUC9T4Q_gMHGZDMz';
  const EVENT_ID='seymur-aytac-yeni';
  const $=id=>document.getElementById(id);
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=t=>{try{return new Date(t).toLocaleString('az-AZ',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Baku'})}catch(e){return ''}};

  async function load(pin){
    $('err').textContent='Yüklənir…';
    try{
      const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/get_messages',{method:'POST',
        headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY},
        body:JSON.stringify({p_event:EVENT_ID,p_pin:pin})});
      const txt=await r.text();
      if(!r.ok){const e=new Error(txt);e.pin=txt.includes('wrong pin');throw e;}
      const msgs=JSON.parse(txt);
      store.set('sa2-host-pin',pin);
      $('login').style.display='none';$('panel').style.display='block';$('err').textContent='';
      $('count').textContent=msgs.length?('Cəmi '+msgs.length+' təbrik'):'';
      $('msgs').innerHTML=msgs.length?msgs.map(m=>`<li><div class="row"><span class="who">${esc(m.name)}</span><span class="when">${fmt(m.created_at)}</span></div><p>${esc(m.body)}</p></li>`).join(''):'<li class="empty">Hələ təbrik yoxdur</li>';
    }catch(e){
      $('login').style.display='block';$('panel').style.display='none';
      $('err').textContent=e.pin?'Şifrə səhvdir':'Bağlantı xətası, yenidən cəhd edin';
    }
  }
  $('go').addEventListener('click',()=>{const p=$('pin').value.trim();if(p)load(p);});
  $('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
  $('refresh').addEventListener('click',()=>{const p=store.get('sa2-host-pin');if(p)load(p);});
  const saved=store.get('sa2-host-pin');if(saved){$('pin').value=saved;load(saved);}
</script>
</body>
</html>
